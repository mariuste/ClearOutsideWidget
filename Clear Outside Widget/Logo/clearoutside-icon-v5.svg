<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background: Nachthimmel -->
    <rect x="0" y="0" width="1024" height="1024" fill="#10213D"/>

    <!-- Wolken oben links, die sich "aufklaeren" -->
    <g fill="#0A1830">
      <circle cx="150" cy="150" r="150"/>
      <circle cx="300" cy="110" r="115"/>
      <circle cx="90" cy="280" r="105"/>
      <circle cx="310" cy="270" r="95"/>
      <circle cx="30" cy="70" r="85"/>
    </g>

    <!-- Wolken unten rechts, spiegelbildlich -->
    <g fill="#0A1830">
      <circle cx="874" cy="874" r="150"/>
      <circle cx="724" cy="914" r="115"/>
      <circle cx="934" cy="744" r="105"/>
      <circle cx="714" cy="754" r="95"/>
      <circle cx="994" cy="954" r="85"/>
    </g>

    <!-- Corona Borealis (Noerdliche Krone): echtes, aber selten genutztes Sternbild -->
    <g stroke="#F4E7C6" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="450" y1="470" x2="470" y2="400"/>
      <line x1="470" y1="400" x2="520" y2="350"/>
      <line x1="520" y1="350" x2="590" y2="330"/>
      <line x1="590" y1="330" x2="660" y2="350"/>
      <line x1="660" y1="350" x2="710" y2="400"/>
      <line x1="710" y1="400" x2="730" y2="470"/>
    </g>
    <g fill="#F4E7C6">
      <circle cx="450" cy="470" r="10"/>
      <circle cx="470" cy="400" r="9"/>
      <circle cx="520" cy="350" r="11"/>
      <circle cx="590" cy="330" r="16"/>
      <circle cx="660" cy="350" r="11"/>
      <circle cx="710" cy="400" r="9"/>
      <circle cx="730" cy="470" r="10"/>
    </g>

    <!-- kleine Mondsichel, eigenstaendig platziert -->
    <circle cx="330" cy="640" r="80" fill="#F4E7C6"/>
    <circle cx="362" cy="612" r="70" fill="#10213D"/>

    <!-- zusaetzliche Hintergrundsterne, verschiedene Groessen -->
    <g fill="#F4E7C6">
      <circle cx="180" cy="420" r="6"/>
      <circle cx="860" cy="300" r="5"/>
      <circle cx="900" cy="510" r="7"/>
      <circle cx="150" cy="600" r="5"/>
      <circle cx="420" cy="200" r="6"/>
      <circle cx="700" cy="200" r="5"/>
      <circle cx="820" cy="630" r="6"/>
      <circle cx="260" cy="740" r="5"/>
      <circle cx="580" cy="730" r="6"/>
      <circle cx="950" cy="440" r="4"/>
      <circle cx="70" cy="490" r="5"/>
      <circle cx="500" cy="860" r="5"/>
      <circle cx="230" cy="500" r="4"/>
      <circle cx="780" cy="660" r="5"/>
      <circle cx="640" cy="710" r="4"/>
      <circle cx="920" cy="200" r="5"/>
      <circle cx="120" cy="700" r="4"/>
      <circle cx="480" cy="230" r="4"/>
    </g>
  </g>
</svg>
